<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUANTUM AI // Cinematic Brand Reveal</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    
    body {
      background-color: #02040a;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    
    input[type=range] {
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.12);
      height: 4px;
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00D2FF;
      cursor: pointer;
      box-shadow: 0 0 12px #00D2FF;
      transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .glass-button {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-button:hover {
      background: rgba(0, 210, 255, 0.12);
      border-color: rgba(0, 210, 255, 0.35);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
    }
    .glass-button:active {
      transform: scale(0.97);
    }

    .chapter-pill {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .chapter-pill:hover, .chapter-pill.active {
      background: rgba(0, 150, 255, 0.15);
      border-color: rgba(0, 210, 255, 0.4);
      color: #ffffff;
    }

    .letterbox-bar {
      position: absolute;
      left: 0;
      right: 0;
      background: #000000;
      z-index: 20;
      transition: height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .letterbox-top { top: 0; }
    .letterbox-bottom { bottom: 0; }

    #canvas-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #010206;
      overflow: hidden;
    }

    #mainCanvas {
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <!-- Top Director Bar -->
  <header class="h-12 border-b border-white/10 px-5 flex items-center justify-between z-30 bg-[#030712]/90 backdrop-blur">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
        <span class="text-xs font-bold tracking-widest text-white">QUANTUM AI</span>
      </div>
      <span class="text-white/20">|</span>
      <span class="text-xs text-slate-400 font-mono">CINEMATIC REVEAL MASTER (60 FPS // 1080P)</span>
    </div>

    <!-- Chapter Navigation -->
    <div class="hidden md:flex items-center gap-1.5 overflow-x-auto">
      <button class="chapter-pill active" onclick="seekTo(0)">01 Midnight Void</button>
      <button class="chapter-pill" onclick="seekTo(4.5)">02 Infrastructure</button>
      <button class="chapter-pill" onclick="seekTo(9.5)">03 Emergence</button>
      <button class="chapter-pill" onclick="seekTo(13.5)">04 Light Sweep</button>
      <button class="chapter-pill" onclick="seekTo(18.0)">05 Enterprise Systems</button>
      <button class="chapter-pill" onclick="seekTo(23.5)">06 Build With Us</button>
    </div>

    <!-- Right Quick Actions -->
    <div class="flex items-center gap-2">
      <button id="btnExport" onclick="toggleExport()" class="glass-button text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-2 text-cyan-400 border-cyan-500/30">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        <span id="exportLabel">Export HD Video</span>
      </button>

      <button id="btnAudio" onclick="toggleAudio()" class="glass-button text-xs font-medium px-2.5 py-1.5 rounded-lg text-slate-300 flex items-center gap-1.5">
        <span id="audioIcon">🔊</span>
        <span id="audioLabel">Audio ON</span>
      </button>
      
      <button onclick="toggleFullscreen()" class="glass-button text-xs font-medium p-1.5 rounded-lg text-slate-300" title="Toggle Fullscreen (F)">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
      </button>
    </div>
  </header>

  <!-- Viewport Area -->
  <main id="canvas-container">
    <div id="letterboxTop" class="letterbox-bar letterbox-top h-0"></div>
    <div id="letterboxBottom" class="letterbox-bar letterbox-bottom h-0"></div>

    <canvas id="mainCanvas" width="1920" height="1080"></canvas>

    <!-- Recording Overlay Banner -->
    <div id="recordingBanner" class="hidden absolute top-5 left-1/2 -translate-x-1/2 z-40 bg-red-950/80 border border-red-500/50 px-4 py-2 rounded-full flex items-center gap-3 backdrop-blur shadow-2xl">
      <span class="w-3 h-3 rounded-full bg-red-500 animate-ping"></span>
      <span class="text-xs font-mono font-bold text-red-200 tracking-wider">RECORDING 60FPS BROADCAST STREAM...</span>
      <span id="recordTimer" class="text-xs font-mono text-white">00:00</span>
    </div>
  </main>

  <!-- Bottom Timeline & Transport Dock -->
  <footer class="border-t border-white/10 px-6 py-3.5 bg-[#030712]/95 backdrop-blur z-30 flex flex-col gap-2.5">
    <div class="flex items-center gap-3">
      <span id="timeCurrent" class="text-xs font-mono text-cyan-400 font-medium w-14">00:00.0</span>
      <div class="relative flex-1 flex items-center">
        <input id="timeline" type="range" min="0" max="30" step="0.01" value="0" class="w-full cursor-pointer z-10" oninput="onScrub(this.value)" onmousedown="isScrubbing = true" onmouseup="isScrubbing = false">
        <div class="absolute w-full flex justify-between pointer-events-none px-1">
          <span class="w-1 h-1 rounded-full bg-white/40"></span>
          <span class="w-1 h-1 rounded-full bg-white/40" style="left: 15%"></span>
          <span class="w-1 h-1 rounded-full bg-white/40" style="left: 31.6%"></span>
          <span class="w-1 h-1 rounded-full bg-white/40" style="left: 45%"></span>
          <span class="w-1 h-1 rounded-full bg-white/40" style="left: 60%"></span>
          <span class="w-1 h-1 rounded-full bg-white/40" style="left: 78.3%"></span>
          <span class="w-1 h-1 rounded-full bg-white/40"></span>
        </div>
      </div>
      <span class="text-xs font-mono text-slate-500 font-medium w-14 text-right">00:30.0</span>
    </div>

    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <button id="btnPlay" onclick="togglePlay()" class="w-10 h-10 rounded-full bg-cyan-500 hover:bg-cyan-400 text-black flex items-center justify-center font-bold transition shadow-lg shadow-cyan-500/20 active:scale-95">
          <svg id="playIcon" class="w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button onclick="restartVideo()" class="glass-button p-2.5 rounded-full text-slate-300" title="Restart (R)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>

        <div class="h-4 w-px bg-white/10 mx-1"></div>

        <div class="flex flex-col">
          <span class="text-[10px] text-slate-500 uppercase tracking-widest font-mono">Active Shot</span>
          <span id="phaseLabel" class="text-xs text-white font-medium">01 // The Midnight Void</span>
        </div>
      </div>

      <div class="hidden lg:flex items-center gap-6 text-xs text-slate-400 font-mono">
        <div class="flex items-center gap-1.5">
          <span class="text-slate-600">FPS:</span>
          <span id="fpsDisplay" class="text-emerald-400">60.0</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-slate-600">RES:</span>
          <span class="text-white">1920×1080 (16:9)</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-slate-600">BRAND ASSET:</span>
          <span class="text-cyan-400">AUTHORITATIVE QUANTUM AI LOGO</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="btnLetterbox" onclick="toggleLetterbox()" class="glass-button text-xs px-2.5 py-1 rounded text-slate-400 hover:text-white">
          2.39:1 Cinema
        </button>
        <span class="text-xs font-mono text-slate-500">Press [Space] Play</span>
      </div>
    </div>
  </footer>

Rf94V+bk0AAAAAElFTkSuQmCC";

    // --- State Variables ---
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1920;
    const HEIGHT = 1080;
    const DURATION = 30.0;

    let currentTime = 0.0;
    let isPlaying = false;
    let isScrubbing = false;
    let lastFrameTime = performance.now();
    let isLetterbox = false;
    let isAudioEnabled = true;

    // --- Audio Synthesis via Web Audio API ---
    let audioCtx = null;
    let droneOsc = null;
    let subOsc = null;
    let masterGain = null;

    function initAudio() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);

        // Sub-bass drone (40Hz - 48Hz)
        subOsc = audioCtx.createOscillator();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(44, audioCtx.currentTime);

        const subGain = audioCtx.createGain();
        subGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        subOsc.connect(subGain);
        subGain.connect(masterGain);
        subOsc.start();

        // Computational Ambiance Drone
        droneOsc = audioCtx.createOscillator();
        droneOsc.type = 'triangle';
        droneOsc.frequency.setValueAtTime(110, audioCtx.currentTime);

        const droneFilter = audioCtx.createBiquadFilter();
        droneFilter.type = 'lowpass';
        droneFilter.frequency.setValueAtTime(220, audioCtx.currentTime);

        const droneGain = audioCtx.createGain();
        droneGain.gain.setValueAtTime(0.12, audioCtx.currentTime);

        droneOsc.connect(droneFilter);
        droneFilter.connect(droneGain);
        droneGain.connect(masterGain);
        droneOsc.start();
      } catch (e) {
        console.warn('Web Audio note:', e);
      }
    }

    function triggerImpactSound() {
      if (!audioCtx || !isAudioEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(90, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(32, audioCtx.currentTime + 1.2);
        gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.9);
      } catch(e) {}
    }

    function triggerShimmerSound() {
      if (!audioCtx || !isAudioEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 2.0);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.2);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        osc.stop(audioCtx.currentTime + 2.3);
      } catch(e) {}
    }

    function toggleAudio() {
      isAudioEnabled = !isAudioEnabled;
      if (masterGain && audioCtx) {
        masterGain.gain.setValueAtTime(isAudioEnabled ? 0.35 : 0, audioCtx.currentTime);
      }
      document.getElementById('audioIcon').innerText = isAudioEnabled ? '🔊' : '🔇';
      document.getElementById('audioLabel').innerText = isAudioEnabled ? 'Audio ON' : 'Audio OFF';
    }

    // --- Particle System ---
    const NUM_PARTICLES = 36;
    const particles = [];
    for (let i = 0; i < NUM_PARTICLES; i++) {
      particles.push({
        x: (Math.random() - 0.5) * WIDTH * 1.5,
        y: (Math.random() - 0.5) * HEIGHT * 1.5,
        z: Math.random() * 800 + 100,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 0.4 + 0.1,
        alpha: Math.random() * 0.4 + 0.15
      });
    }

    // --- Computational Network Nodes ---
    const networkNodes = [];
    const NUM_NODES = 42;
    for (let i = 0; i < NUM_NODES; i++) {
      networkNodes.push({
        x: (Math.random() - 0.5) * WIDTH * 1.2,
        y: (Math.random() - 0.5) * HEIGHT * 0.9,
        z: (Math.random() - 0.5) * 600,
        radius: Math.random() * 3 + 2,
        activePulse: Math.random() * 10
      });
    }

    const networkEdges = [];
    for (let i = 0; i < networkNodes.length; i++) {
      for (let j = i + 1; j < networkNodes.length; j++) {
        const dx = networkNodes[i].x - networkNodes[j].x;
        const dy = networkNodes[i].y - networkNodes[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 320 && networkEdges.length < 55) {
          networkEdges.push({ from: i, to: j, length: dist });
        }
      }
    }

    function smoothstep(min, max, value) {
      const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
      return x * x * (3 - 2 * x);
    }

    let soundTriggered13 = false;
    let soundTriggered10 = false;

    function renderFrame(t) {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      const cx = WIDTH / 2;
      const cy = HEIGHT / 2;

      // Base Background: Midnight void
      ctx.fillStyle = '#02040a';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Distant atmospheric blue radial glow
      const distGlow = ctx.createRadialGradient(cx, cy, 50, cx, cy, 750);
      distGlow.addColorStop(0, 'rgba(8, 28, 70, 0.22)');
      distGlow.addColorStop(0.5, 'rgba(4, 14, 38, 0.10)');
      distGlow.addColorStop(1, 'rgba(2, 4, 10, 0.0)');
      ctx.fillStyle = distGlow;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Atmospheric Particles
      const particleAlphaMultiplier = t < 23.5 ? 1.0 : 0.3;
      particles.forEach((p) => {
        p.z -= p.speed * 0.8;
        if (p.z <= 20) p.z = 900;

        const fov = 500;
        const scale = fov / (fov + p.z);
        const px = cx + p.x * scale;
        const py = cy + p.y * scale;

        if (px >= 0 && px <= WIDTH && py >= 0 && py <= HEIGHT) {
          ctx.fillStyle = 'rgba(160, 210, 255, ' + (p.alpha * scale * particleAlphaMultiplier) + ')';
          ctx.beginPath();
          ctx.arc(px, py, p.size * scale, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // -------------------------------------------------------------
      // SCENE 1: THE MIDNIGHT VOID (0.0s - 4.5s)
      // -------------------------------------------------------------
      if (t < 4.5) {
        updatePhaseLabel('01 // The Midnight Void (00:00 - 00:04)');
        const introFade = smoothstep(0.0, 2.0, t);

        const pulse = 1.0 + Math.sin(t * 1.2) * 0.05;
        const ambientGlow = ctx.createRadialGradient(cx, cy, 10, cx, cy, 450 * pulse);
        ambientGlow.addColorStop(0, 'rgba(0, 102, 255, ' + (0.12 * introFade) + ')');
        ambientGlow.addColorStop(0.7, 'rgba(0, 40, 120, ' + (0.04 * introFade) + ')');
        ambientGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = ambientGlow;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      // -------------------------------------------------------------
      // SCENE 2: COMPUTATIONAL INFRASTRUCTURE (4.5s - 9.5s)
      // -------------------------------------------------------------
      else if (t >= 4.5 && t < 9.5) {
        updatePhaseLabel('02 // Computational Network (00:04 - 00:09)');
        const pScene = (t - 4.5) / 5.0;
        const camZ = pScene * 250;

        networkEdges.forEach((edge, idx) => {
          const n1 = networkNodes[edge.from];
          const n2 = networkNodes[edge.to];

          const fov = 600;
          const z1 = n1.z + 400 - camZ;
          const z2 = n2.z + 400 - camZ;

          if (z1 > 30 && z2 > 30) {
            const s1 = fov / z1;
            const s2 = fov / z2;
            const x1 = cx + n1.x * s1;
            const y1 = cy + n1.y * s1;
            const x2 = cx + n2.x * s2;
            const y2 = cy + n2.y * s2;

            const lineProgress = smoothstep(idx / networkEdges.length * 0.6, idx / networkEdges.length * 0.6 + 0.35, pScene);
            if (lineProgress > 0) {
              const curX2 = x1 + (x2 - x1) * lineProgress;
              const curY2 = y1 + (y2 - y1) * lineProgress;

              ctx.strokeStyle = 'rgba(0, 120, 255, ' + (0.18 * lineProgress) + ')';
              ctx.lineWidth = 1.0;
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(curX2, curY2);
              ctx.stroke();

              const pulsePos = (t * 2.5 + idx * 0.3) % 1.0;
              const px = x1 + (x2 - x1) * pulsePos;
              const py = y1 + (y2 - y1) * pulsePos;

              const pulseGrad = ctx.createRadialGradient(px, py, 0, px, py, 8);
              pulseGrad.addColorStop(0, 'rgba(0, 230, 255, 0.9)');
              pulseGrad.addColorStop(0.5, 'rgba(0, 140, 255, 0.4)');
              pulseGrad.addColorStop(1, 'rgba(0, 80, 255, 0)');
              ctx.fillStyle = pulseGrad;
              ctx.beginPath();
              ctx.arc(px, py, 6, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        });

        for (let g = 0; g < 4; g++) {
          const gz = (g * 160 + 300 - camZ);
          if (gz > 50) {
            const gs = 600 / gz;
            const gx = cx - 350 * gs;
            const gy = cy - 200 * gs;
            const gw = 700 * gs;
            const gh = 400 * gs;

            ctx.fillStyle = 'rgba(10, 20, 45, ' + (0.08 * (1 - gz / 800)) + ')';
            ctx.fillRect(gx, gy, gw, gh);
            ctx.strokeStyle = 'rgba(0, 180, 255, ' + (0.12 * (1 - gz / 800)) + ')';
            ctx.lineWidth = 1;
            ctx.strokeRect(gx, gy, gw, gh);
          }
        }
      }

      // -------------------------------------------------------------
      // SCENE 3: THE QUIET & EMERGENCE (9.5s - 13.5s)
      // -------------------------------------------------------------
      else if (t >= 9.5 && t < 13.5) {
        updatePhaseLabel('03 // The Quiet & Emergence (00:09 - 00:13)');
        const pScene = (t - 9.5) / 4.0;

        if (!soundTriggered10 && pScene > 0.4) {
          triggerImpactSound();
          soundTriggered10 = true;
        }

        const residualAlpha = Math.max(0, 1 - pScene * 2.8);
        if (residualAlpha > 0) {
          ctx.strokeStyle = 'rgba(0, 120, 255, ' + (0.12 * residualAlpha) + ')';
          ctx.lineWidth = 1;
          ctx.strokeRect(cx - 300, cy - 180, 600, 360);
        }

        const backlightBloom = smoothstep(0.2, 0.9, pScene);
        const rimGlow = ctx.createRadialGradient(cx, cy, 20, cx, cy, 380);
        rimGlow.addColorStop(0, 'rgba(0, 128, 255, ' + (0.35 * backlightBloom) + ')');
        rimGlow.addColorStop(0.4, 'rgba(0, 80, 200, ' + (0.18 * backlightBloom) + ')');
        rimGlow.addColorStop(0.8, 'rgba(5, 20, 60, ' + (0.06 * backlightBloom) + ')');
        rimGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = rimGlow;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const logoAlpha = smoothstep(0.35, 1.0, pScene);
        const logoScale = 0.88 + 0.12 * smoothstep(0.35, 1.0, pScene);

        if (logoImg.complete && logoAlpha > 0) {
          const baseW = 440;
          const baseH = (440 / 510) * 489;
          const w = baseW * logoScale;
          const h = baseH * logoScale;

          ctx.save();
          ctx.globalAlpha = logoAlpha;
          ctx.drawImage(logoImg, cx - w / 2, cy - h / 2, w, h);
          ctx.restore();
        }
      }

      // -------------------------------------------------------------
      // SCENE 4: SPECULAR LIGHT SWEEP & IDENTITY REVEAL (13.5s - 18.0s)
      // -------------------------------------------------------------
      else if (t >= 13.5 && t < 18.0) {
        updatePhaseLabel('04 // Cinematic Light Sweep (00:13 - 00:18)');
        const pScene = (t - 13.5) / 4.5;

        if (!soundTriggered13 && pScene > 0.05) {
          triggerShimmerSound();
          soundTriggered13 = true;
        }

        const ambientGlow = ctx.createRadialGradient(cx, cy - 30, 40, cx, cy - 30, 440);
        ambientGlow.addColorStop(0, 'rgba(0, 140, 255, 0.28)');
        ambientGlow.addColorStop(0.5, 'rgba(0, 70, 180, 0.12)');
        ambientGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = ambientGlow;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const baseW = 440;
        const baseH = (440 / 510) * 489;
        const lx = cx - baseW / 2;
        const ly = cy - baseH / 2 - 35;

        if (logoImg.complete) {
          ctx.save();
          ctx.drawImage(logoImg, lx, ly, baseW, baseH);

          // Specular Light Sweep
          const sweepX = lx - 150 + pScene * (baseW + 300);
          const sweepGrad = ctx.createLinearGradient(sweepX - 80, ly, sweepX + 80, ly + baseH);
          sweepGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
          sweepGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0.35)');
          sweepGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.7)');
          sweepGrad.addColorStop(0.6, 'rgba(0, 210, 255, 0.4)');
          sweepGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

          ctx.globalCompositeOperation = 'source-atop';
          ctx.fillStyle = sweepGrad;
          ctx.fillRect(lx, ly, baseW, baseH);
          ctx.restore();
        }

        // Typography: QUANTUM AI
        const text1Alpha = smoothstep(0.35, 0.65, pScene);
        if (text1Alpha > 0) {
          ctx.save();
          ctx.globalAlpha = text1Alpha;
          ctx.textAlign = 'center';
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '700 38px Inter, -apple-system, sans-serif';
          ctx.letterSpacing = '0.30em';
          ctx.shadowColor = 'rgba(0, 150, 255, 0.5)';
          ctx.shadowBlur = 20;
          ctx.fillText('QUANTUM AI', cx + 10, cy + baseH / 2 + 30);
          ctx.restore();
        }

        // Tagline: WE BUILD INTELLIGENT SOFTWARE.
        const text2Alpha = smoothstep(0.65, 0.95, pScene);
        if (text2Alpha > 0) {
          ctx.save();
          ctx.globalAlpha = text2Alpha;
          ctx.textAlign = 'center';
          ctx.fillStyle = '#E2E8F0';
          ctx.font = '400 17px Inter, -apple-system, sans-serif';
          ctx.letterSpacing = '0.24em';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
          ctx.shadowBlur = 10;
          ctx.fillText('WE BUILD INTELLIGENT SOFTWARE.', cx + 6, cy + baseH / 2 + 76);
          ctx.restore();
        }
      }

      // -------------------------------------------------------------
      // SCENE 5: CONNECTED ENTERPRISE SYSTEMS (18.0s - 23.5s)
      // -------------------------------------------------------------
      else if (t >= 18.0 && t < 23.5) {
        updatePhaseLabel('05 // Connected Enterprise Systems (00:18 - 00:23)');
        const pScene = (t - 18.0) / 5.5;

        const baseW = 380;
        const baseH = (380 / 510) * 489;
        const lx = cx - baseW / 2;
        const ly = cy - baseH / 2 - 70;

        const systemsAlpha = smoothstep(0.1, 0.5, pScene);

        const cardDefs = [
          { label: 'AI SYSTEMS & MODELS', value: 'AUTONOMOUS ORCHESTRATION', x: cx - 680, y: cy - 140 },
          { label: 'ENTERPRISE WORKFLOWS', value: 'HIGH-PRECISION AUTOMATION', x: cx + 380, y: cy - 140 },
          { label: 'INTELLIGENT SOFTWARE', value: 'DISTRIBUTED ARCHITECTURE', x: cx - 680, y: cy + 90 },
          { label: 'CONNECTED DATA PIPELINES', value: 'LOW-LATENCY INFERENCE', x: cx + 380, y: cy + 90 }
        ];

        cardDefs.forEach((card) => {
          ctx.save();
          ctx.globalAlpha = systemsAlpha * 0.85;

          ctx.fillStyle = 'rgba(8, 16, 36, 0.75)';
          ctx.fillRect(card.x, card.y, 300, 72);
          ctx.strokeStyle = 'rgba(0, 180, 255, 0.25)';
          ctx.lineWidth = 1;
          ctx.strokeRect(card.x, card.y, 300, 72);

          ctx.fillStyle = '#00D2FF';
          ctx.beginPath();
          ctx.arc(card.x + 18, card.y + 24, 3, 0, Math.PI * 2);
          ctx.fill();

          ctx.textAlign = 'left';
          ctx.font = '600 11px Inter, sans-serif';
          ctx.letterSpacing = '0.18em';
          ctx.fillStyle = '#60A5FA';
          ctx.fillText(card.label, card.x + 30, card.y + 27);

          ctx.font = '400 13px Inter, sans-serif';
          ctx.letterSpacing = '0.08em';
          ctx.fillStyle = '#F8FAFC';
          ctx.fillText(card.value, card.x + 30, card.y + 52);

          ctx.strokeStyle = 'rgba(0, 140, 255, 0.12)';
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(card.x + 150, card.y + 36);
          ctx.lineTo(cx, cy - 30);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.restore();
        });

        if (logoImg.complete) {
          ctx.save();
          ctx.drawImage(logoImg, lx, ly, baseW, baseH);
          ctx.restore();
        }

        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '700 32px Inter, sans-serif';
        ctx.letterSpacing = '0.28em';
        ctx.fillText('QUANTUM AI', cx + 8, cy + baseH / 2 - 15);

        ctx.fillStyle = '#94A3B8';
        ctx.font = '400 15px Inter, sans-serif';
        ctx.letterSpacing = '0.22em';
        ctx.fillText('WE BUILD INTELLIGENT SOFTWARE.', cx + 5, cy + baseH / 2 + 25);
        ctx.restore();
      }

      // -------------------------------------------------------------
      // SCENE 6: FINAL CLEAN DARK FRAME - BUILD WITH US (23.5s - 30.0s)
      // -------------------------------------------------------------
      else {
        updatePhaseLabel('06 // Build With Us & Final Frame (00:23 - 00:30)');
        const pScene = (t - 23.5) / 6.5;

        ctx.fillStyle = '#020408';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const finalGlow = ctx.createRadialGradient(cx, 260, 30, cx, 260, 480);
        finalGlow.addColorStop(0, 'rgba(0, 102, 255, 0.20)');
        finalGlow.addColorStop(0.6, 'rgba(0, 40, 120, 0.05)');
        finalGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = finalGlow;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const baseW = 340;
        const baseH = (340 / 510) * 489;
        const lx = cx - baseW / 2;
        const ly = 130;

        if (logoImg.complete) {
          ctx.save();
          ctx.drawImage(logoImg, lx, ly, baseW, baseH);
          ctx.restore();
        }

        // Line 1: WE'RE HIRING
        const t1Alpha = smoothstep(0.08, 0.28, pScene);
        if (t1Alpha > 0) {
          ctx.save();
          ctx.globalAlpha = t1Alpha;
          ctx.textAlign = 'center';
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '800 36px Inter, sans-serif';
          ctx.letterSpacing = '0.30em';
          ctx.shadowColor = 'rgba(0, 150, 255, 0.4)';
          ctx.shadowBlur = 18;
          ctx.fillText("WE'RE HIRING", cx + 6, ly + baseH + 60);
          ctx.restore();
        }

        // Line 2: BUSINESS DEVELOPMENT & SALES
        const t2Alpha = smoothstep(0.28, 0.48, pScene);
        if (t2Alpha > 0) {
          ctx.save();
          ctx.globalAlpha = t2Alpha;
          ctx.textAlign = 'center';
          ctx.fillStyle = '#94A3B8';
          ctx.font = '600 21px Inter, sans-serif';
          ctx.letterSpacing = '0.22em';
          ctx.fillText('BUSINESS DEVELOPMENT & SALES', cx + 4, ly + baseH + 110);
          ctx.restore();
        }

        // Line 3: BUILD WITH US.
        const t3Alpha = smoothstep(0.48, 0.70, pScene);
        if (t3Alpha > 0) {
          ctx.save();
          ctx.globalAlpha = t3Alpha;
          ctx.textAlign = 'center';
          ctx.fillStyle = '#38BDF8';
          ctx.font = '700 24px Inter, sans-serif';
          ctx.letterSpacing = '0.30em';
          ctx.shadowColor = 'rgba(56, 189, 248, 0.6)';
          ctx.shadowBlur = 22;
          ctx.fillText('BUILD WITH US.', cx + 6, ly + baseH + 160);
          ctx.restore();
        }

        // Reserved Clean Empty Area for Real QR Code (NO fake QR generated)
        const qrAlpha = smoothstep(0.65, 0.88, pScene);
        if (qrAlpha > 0) {
          const qrBoxSize = 130;
          const qrx = cx - qrBoxSize / 2;
          const qry = ly + baseH + 210;

          ctx.save();
          ctx.globalAlpha = qrAlpha;

          ctx.strokeStyle = 'rgba(0, 210, 255, 0.4)';
          ctx.lineWidth = 1.5;
          const tickLen = 12;

          ctx.beginPath(); ctx.moveTo(qrx, qry + tickLen); ctx.lineTo(qrx, qry); ctx.lineTo(qrx + tickLen, qry); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(qrx + qrBoxSize - tickLen, qry); ctx.lineTo(qrx + qrBoxSize, qry); ctx.lineTo(qrx + qrBoxSize, qry + tickLen); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(qrx, qry + qrBoxSize - tickLen); ctx.lineTo(qrx, qry + qrBoxSize); ctx.lineTo(qrx + tickLen, qry + qrBoxSize); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(qrx + qrBoxSize - tickLen, qry + qrBoxSize); ctx.lineTo(qrx + qrBoxSize, qry + qrBoxSize); ctx.lineTo(qrx + qrBoxSize, qry + qrBoxSize - tickLen); ctx.stroke();

          ctx.setLineDash([4, 4]);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.strokeRect(qrx + 4, qry + 4, qrBoxSize - 8, qrBoxSize - 8);
          ctx.setLineDash([]);

          ctx.textAlign = 'center';
          ctx.fillStyle = '#64748B';
          ctx.font = '500 10px Inter, monospace';
          ctx.letterSpacing = '0.18em';
          ctx.fillText('RESERVED FOR QR CODE', cx, qry + qrBoxSize / 2 - 4);
          ctx.font = '400 9px Inter, monospace';
          ctx.fillStyle = '#475569';
          ctx.fillText('[ INSERT CODE HERE ]', cx, qry + qrBoxSize / 2 + 14);

          ctx.restore();
        }
      }
    }

    let frameCount = 0;
    let lastFpsUpdate = performance.now();

    function animate(timestamp) {
      const delta = (timestamp - lastFrameTime) / 1000.0;
      lastFrameTime = timestamp;

      frameCount++;
      if (timestamp - lastFpsUpdate > 500) {
        const fps = Math.round((frameCount * 1000) / (timestamp - lastFpsUpdate));
        document.getElementById('fpsDisplay').innerText = fps.toFixed(1);
        frameCount = 0;
        lastFpsUpdate = timestamp;
      }

      if (isPlaying && !isScrubbing) {
        currentTime += delta;
        if (currentTime >= DURATION) {
          currentTime = DURATION;
          pauseVideo();
        }
        updateTimelineUI();
      }

      renderFrame(currentTime);
      requestAnimationFrame(animate);
    }

    function togglePlay() {
      if (isPlaying) {
        pauseVideo();
      } else {
        playVideo();
      }
    }

    function playVideo() {
      initAudio();
      isPlaying = true;
      document.getElementById('btnPlay').classList.remove('bg-cyan-500', 'text-black');
      document.getElementById('btnPlay').classList.add('bg-amber-500', 'text-black');
      document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }

    function pauseVideo() {
      isPlaying = false;
      document.getElementById('btnPlay').classList.remove('bg-amber-500', 'text-black');
      document.getElementById('btnPlay').classList.add('bg-cyan-500', 'text-black');
      document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
    }

    function restartVideo() {
      currentTime = 0.0;
      soundTriggered10 = false;
      soundTriggered13 = false;
      updateTimelineUI();
      playVideo();
    }

    function seekTo(seconds) {
      currentTime = Math.max(0, Math.min(DURATION, seconds));
      if (currentTime < 10) soundTriggered10 = false;
      if (currentTime < 13.5) soundTriggered13 = false;
      updateTimelineUI();
      updateChapterPills();
    }

    function onScrub(val) {
      seekTo(parseFloat(val));
    }

    function updateTimelineUI() {
      const slider = document.getElementById('timeline');
      slider.value = currentTime;

      const mins = Math.floor(currentTime / 60);
      const secs = (currentTime % 60).toFixed(1);
      document.getElementById('timeCurrent').innerText = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;

      updateChapterPills();
    }

    function updateChapterPills() {
      const pills = document.querySelectorAll('.chapter-pill');
      pills.forEach(p => p.classList.remove('active'));

      if (currentTime < 4.5) pills[0]?.classList.add('active');
      else if (currentTime < 9.5) pills[1]?.classList.add('active');
      else if (currentTime < 13.5) pills[2]?.classList.add('active');
      else if (currentTime < 18.0) pills[3]?.classList.add('active');
      else if (currentTime < 23.5) pills[4]?.classList.add('active');
      else pills[5]?.classList.add('active');
    }

    function updatePhaseLabel(label) {
      const el = document.getElementById('phaseLabel');
      if (el && el.innerText !== label) {
        el.innerText = label;
      }
    }

    function toggleLetterbox() {
      isLetterbox = !isLetterbox;
      const top = document.getElementById('letterboxTop');
      const btm = document.getElementById('letterboxBottom');
      if (isLetterbox) {
        top.classList.replace('h-0', 'h-14');
        btm.classList.replace('h-0', 'h-14');
        document.getElementById('btnLetterbox').classList.add('bg-cyan-500/20', 'text-cyan-400', 'border-cyan-500/30');
      } else {
        top.classList.replace('h-14', 'h-0');
        btm.classList.replace('h-14', 'h-0');
        document.getElementById('btnLetterbox').classList.remove('bg-cyan-500/20', 'text-cyan-400', 'border-cyan-500/30');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'KeyF') {
        toggleFullscreen();
      } else if (e.code === 'KeyR') {
        restartVideo();
      } else if (e.code === 'KeyM') {
        toggleAudio();
      } else if (e.code === 'ArrowRight') {
        seekTo(currentTime + 1.0);
      } else if (e.code === 'ArrowLeft') {
        seekTo(currentTime - 1.0);
      }
    });

    // --- MediaRecorder Video Exporter ---
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    function toggleExport() {
      if (isRecording) {
        stopRecording();
        return;
      }

      const stream = canvas.captureStream(60);
      let options = { mimeType: 'video/webm;codecs=vp9' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm' };
      }

      recordedChunks = [];
      try {
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        alert('MediaRecorder is not supported in this browser environment.');
        return;
      }

      mediaRecorder.ondataavailable = function(e) {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = function() {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'Quantum_AI_Cinematic_Brand_Reveal_1080p.webm';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        }, 100);

        document.getElementById('recordingBanner').classList.add('hidden');
        document.getElementById('exportLabel').innerText = 'Export HD Video';
        document.getElementById('btnExport').classList.remove('bg-red-500/20', 'text-red-400', 'border-red-500');
        isRecording = false;
      };

      isRecording = true;
      document.getElementById('recordingBanner').classList.remove('hidden');
      document.getElementById('exportLabel').innerText = 'Stop & Save';
      document.getElementById('btnExport').classList.add('bg-red-500/20', 'text-red-400', 'border-red-500');

      mediaRecorder.start();
      restartVideo();

      const checkEnd = setInterval(() => {
        if (!isRecording) {
          clearInterval(checkEnd);
          return;
        }
        document.getElementById('recordTimer').innerText = currentTime.toFixed(1) + 's / 30.0s';
        if (currentTime >= DURATION - 0.1) {
          clearInterval(checkEnd);
          stopRecording();
        }
      }, 100);
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    logoImg.onload = () => {
      renderFrame(0.0);
      requestAnimationFrame(animate);
    };
    if (logoImg.complete) {
      renderFrame(0.0);
      requestAnimationFrame(animate);
    }
  </script>
